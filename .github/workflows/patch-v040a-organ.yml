name: Patch v0.4.0.a organ route

on:
  push:
    branches:
      - agent/v035-structural-prototype
    paths:
      - scripts/patch_v040a_organ.mjs
      - .github/workflows/patch-v040a-organ.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v035-structural-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch_v040a_organ.mjs
      - name: Commit generator patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-v040a-organ.yml
          git add -A
          git commit -m "fix: add organ room reward to v0.4.0.a"
          git push origin HEAD:agent/v035-structural-prototype
