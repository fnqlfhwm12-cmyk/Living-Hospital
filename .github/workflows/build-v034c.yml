name: Build v0.3.4.c combat and UI fixes
on:
  push:
    paths:
      - .github/workflows/build-v034c.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.3.4.c
        run: node scripts/build_v034c.mjs
      - name: Validate repository
        run: node scripts/validate_repo.mjs
      - name: Commit generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v034c Living_Hospital_v0.3.4.c.html index.html stable-v034c.html playtest.html README.md AGENTS.md docs/PROJECT_STATUS.md docs/CHANGELOG.md UPDATE_v0.3.4.c.md
          git diff --cached --quiet || git commit -m "build: publish v0.3.4.c combat and UI fixes"
          git push
