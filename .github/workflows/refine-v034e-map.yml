name: Refine v0.3.4.e map

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/refine_v034e_map.mjs'
      - '.github/workflows/refine-v034e-map.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refine_v034e_map.mjs
      - run: node scripts/validate_repo.mjs
      - name: Commit refined runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v034e
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: clear v0.3.4.e ward entrances and start area'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
