name: Inspect v0.3.4.c next changes
on:
  push:
    paths:
      - .github/workflows/inspect-v034c-next.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime
        run: node scripts/inspect_v034c_next.mjs
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/v034c-next-inspect.txt
          git diff --cached --quiet || git commit -m "chore: publish v0.3.4.c targeted inspection"
          git push
