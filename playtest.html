<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Living Hospital Playtest Monitor</title>
<style>
:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090707}#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#100d0d}#toggle{position:fixed;z-index:2147483646;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:42px;height:42px;border:1px solid rgba(255,255,255,.6);border-radius:50%;background:rgba(15,12,12,.82);color:#fff;font:700 11px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.6);-webkit-tap-highlight-color:transparent}#toggle:active{transform:scale(.95)}#shade{position:fixed;z-index:2147483645;inset:0;display:none;background:rgba(0,0,0,.56)}#shade.open{display:block}#panel{position:fixed;z-index:2147483647;left:50%;top:50%;transform:translate(-50%,-50%);display:none;width:min(620px,94vw);max-height:88vh;overflow:auto;box-sizing:border-box;padding:14px;border:1px solid rgba(255,255,255,.75);border-radius:14px;background:rgba(24,18,18,.98);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;box-shadow:0 18px 55px rgba(0,0,0,.72)}#panel.open{display:block}h1{margin:0 0 10px;font-size:18px}#summary{white-space:pre-wrap;margin:0 0 12px;padding:10px;border-radius:9px;background:#100d0d;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.actions a{box-sizing:border-box;border:1px solid rgba(255,255,255,.62);border-radius:9px;background:#2a2020;color:#fff;padding:11px 10px;text-align:center;text-decoration:none;font:700 13px/1.1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.wide{grid-column:1/-1}#status{min-height:18px;margin-top:9px;font-size:12px;opacity:.82}@media(orientation:landscape){#toggle{right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%)}#toggle:active{transform:translateY(-50%) scale(.95)}}
</style>
</head>
<body>
<iframe id="gameFrame" title="Living Hospital" src="./Living_Hospital_v0.3.3.t.html" allow="autoplay"></iframe>
<div id="shade"></div>
<button id="toggle" type="button" aria-label="플레이테스트 기록 열기">기록</button>
<section id="panel" aria-label="플레이테스트 기록">
<h1>플레이테스트 기록</h1>
<pre id="summary">게임을 불러오는 중…</pre>
<div class="actions">
<button id="copyBtn" type="button">보고서 복사</button><button id="shareBtn" type="button">공유</button>
<button id="resetBtn" type="button">기록 초기화</button><button id="closeBtn" type="button">닫기</button>
<a class="wide" href="./Living_Hospital_v0.3.3.t.html">일반 플레이 열기</a>
</div><div id="status" role="status"></div>
</section>
<script>
(()=>{'use strict';
const GAME_FILE='Living_Hospital_v0.3.3.t.html',frame=document.getElementById('gameFrame'),toggle=document.getElementById('toggle'),panel=document.getElementById('panel'),shade=document.getElementById('shade'),summary=document.getElementById('summary'),status=document.getElementById('status');
const state={resetAt:new Date(),fps:[],latest:null,min:null,avg:null,longTasks:0,longMs:0,touches:0,visibility:0,orientation:0,errors:[],rejections:[]};let frames=0,windowStart=performance.now(),observer=null;
const clamp=(v,n=900)=>String(v??'').slice(0,n);const orientation=()=>screen.orientation?.type||(innerWidth>=innerHeight?'landscape':'portrait');
function record(kind,msg,src='',line=0){const arr=kind==='rejection'?state.rejections:state.errors;arr.push({message:clamp(msg),source:clamp(src,250),line});if(arr.length>20)arr.shift()}
function fps(now){frames++;const elapsed=now-windowStart;if(elapsed>=1000){const value=Math.round(frames*10000/elapsed)/10;state.latest=value;state.fps.push(value);if(state.fps.length>600)state.fps.shift();state.min=Math.min(...state.fps);state.avg=Math.round(state.fps.reduce((a,b)=>a+b,0)/state.fps.length*10)/10;frames=0;windowStart=now;if(panel.classList.contains('open'))render()}requestAnimationFrame(fps)}requestAnimationFrame(fps);
function childText(selector){try{return clamp(frame.contentDocument?.querySelector(selector)?.textContent?.trim()||'',1200)}catch{return''}}
function snap(){const sec=Math.max(0,Math.round((Date.now()-state.resetAt)/1000));let title='';try{title=frame.contentDocument?.title||''}catch{}return{generatedAt:new Date().toISOString(),gameFile:GAME_FILE,gameTitle:title,gameTimer:childText('#timer'),gameDebug:childText('#debug'),sessionSeconds:sec,performance:{averageFps:state.avg,minimumFps:state.min,latestFps:state.latest,longTasks:state.longTasks,longTaskTotalMs:Math.round(state.longMs)},interaction:{touches:state.touches,visibilityChanges:state.visibility,orientationChanges:state.orientation},environment:{viewport:`${innerWidth}x${innerHeight}`,devicePixelRatio,orientation:orientation(),userAgent:navigator.userAgent},errors:state.errors,unhandledRejections:state.rejections}}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function report(d=snap()){const e=d.errors.length?d.errors.map((x,i)=>`${i+1}. ${x.message} (${x.source||'unknown'}:${x.line||0})`).join('\n'):'없음',r=d.unhandledRejections.length?d.unhandledRejections.map((x,i)=>`${i+1}. ${x.message}`).join('\n'):'없음';return`# Living Hospital 플레이테스트 보고서\n\n- 생성 시각: ${d.generatedAt}\n- 게임 파일: ${d.gameFile}\n- 게임 제목: ${d.gameTitle||'확인 불가'}\n- 기록 시간: ${fmt(d.sessionSeconds)}\n- 게임 타이머: ${d.gameTimer||'확인 불가'}\n- 평균 FPS: ${d.performance.averageFps??'표본 부족'}\n- 최저 FPS: ${d.performance.minimumFps??'표본 부족'}\n- 최근 FPS: ${d.performance.latestFps??'표본 부족'}\n- Long Task: ${d.performance.longTasks}회 / ${d.performance.longTaskTotalMs}ms\n- 터치 입력: ${d.interaction.touches}회\n- 화면 방향 변경: ${d.interaction.orientationChanges}회\n- 화면 숨김·복귀: ${d.interaction.visibilityChanges}회\n- 환경: ${d.environment.viewport}, DPR ${d.environment.devicePixelRatio}, ${d.environment.orientation}\n- 사용자 환경: ${d.environment.userAgent}\n\n## 게임 디버그 표시\n\n${d.gameDebug||'없음'}\n\n## JavaScript 오류\n\n${e}\n\n## 처리되지 않은 Promise 오류\n\n${r}\n\n## 체감 메모\n\n- 난이도:\n- 조작감:\n- 공격 판독성:\n- 발열·프레임 체감:\n- 재현 시점:\n- 수정 필요 사항:\n`}
function render(){const d=snap();summary.textContent=[`빌드  ${d.gameFile}`,`시간  ${fmt(d.sessionSeconds)} · 게임 ${d.gameTimer||'—'}`,`FPS   평균 ${d.performance.averageFps??'—'} · 최저 ${d.performance.minimumFps??'—'} · 최근 ${d.performance.latestFps??'—'}`,`지연  Long Task ${d.performance.longTasks}회 / ${d.performance.longTaskTotalMs}ms`,`입력  터치 ${d.interaction.touches}회 · 방향 변경 ${d.interaction.orientationChanges}회`,`오류  JS ${d.errors.length}건 · Promise ${d.unhandledRejections.length}건`,`화면  ${d.environment.viewport} · DPR ${d.environment.devicePixelRatio}`].join('\n')}
function open(v){panel.classList.toggle('open',v);shade.classList.toggle('open',v);if(v)render()}
async function copy(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw Error('복사 기능을 사용할 수 없습니다.')}
function attach(){try{const w=frame.contentWindow,d=frame.contentDocument;w.addEventListener('error',e=>record('error',e.message||e.error,e.filename,e.lineno));w.addEventListener('unhandledrejection',e=>record('rejection',e.reason?.stack||e.reason?.message||e.reason));d.addEventListener('touchstart',e=>{state.touches+=Math.max(1,e.touches?.length||1)},{passive:true,capture:true});if(w.PerformanceObserver){observer?.disconnect?.();observer=new w.PerformanceObserver(list=>{for(const x of list.getEntries()){state.longTasks++;state.longMs+=x.duration||0}});observer.observe({type:'longtask',buffered:true})}}catch(e){record('error',`모니터 연결 실패: ${e.message||e}`)}render()}
frame.addEventListener('load',attach);window.addEventListener('error',e=>record('error',e.message||e.error,e.filename,e.lineno));window.addEventListener('unhandledrejection',e=>record('rejection',e.reason?.stack||e.reason?.message||e.reason));document.addEventListener('visibilitychange',()=>state.visibility++);window.addEventListener('orientationchange',()=>state.orientation++);
toggle.addEventListener('click',()=>open(true));shade.addEventListener('click',()=>open(false));document.getElementById('closeBtn').addEventListener('click',()=>open(false));document.getElementById('copyBtn').addEventListener('click',async()=>{try{await copy(report());status.textContent='보고서를 복사했습니다.'}catch(e){status.textContent=`복사 실패: ${e.message||e}`}});document.getElementById('shareBtn').addEventListener('click',async()=>{try{const text=report();if(navigator.share)await navigator.share({title:'Living Hospital 플레이테스트 보고서',text});else await copy(text)}catch(e){if(e?.name!=='AbortError')status.textContent=`공유 실패: ${e.message||e}`}});document.getElementById('resetBtn').addEventListener('click',()=>{state.resetAt=new Date();state.fps=[];state.latest=state.min=state.avg=null;state.longTasks=state.longMs=state.touches=state.visibility=state.orientation=0;state.errors=[];state.rejections=[];status.textContent='기록을 초기화했습니다. 게임은 계속 진행됩니다.';render()});render();setInterval(()=>{if(panel.classList.contains('open'))render()},1000);
})();
</script>
</body>
</html>
