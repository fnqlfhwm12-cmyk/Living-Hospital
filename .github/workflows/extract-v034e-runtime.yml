name: Build v0.3.4.f

on:
  push:
    branches:
      - fix/v034f-suture-map-spawn
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v034f-suture-map-spawn
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract baseline runtime
        run: node scripts/extract_v034e_runtime.mjs
      - name: Reconstruct patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts=[Path(f'scripts/v034f-patch.part{i:02}.b64').read_text().strip() for i in range(1,8)]
          if parts[5].endswith('eQ=='):
              parts[5]=parts[5][:-4]
          payload=base64.b64decode(''.join(parts), validate=True)
          digest=hashlib.sha256(payload).hexdigest()
          assert digest=='f2b11273cb4ab17f8a8641ab7f7243b05092bea83ce2f147c1addfcb00a5e4ab', digest
          Path('tmp-runtime/patch_v034f.py').write_bytes(payload)
          PY
      - name: Patch runtime
        run: python tmp-runtime/patch_v034f.py
      - name: Validate JavaScript syntax and required behavior hooks
        run: |
          node --check tmp-runtime/runtime-v034f.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          source=Path('tmp-runtime/runtime-v034f.js').read_text()
          required=[
            "const WARD_BOUNDS={halfW:2300,halfH:1400",
            "function threadStitchGroup(",
            "stitch:{mode:'structure',event:'doubleCluster'",
            "function damageTargetsAlongSegment(",
            "function enemySpawnOutsideView(",
            "render:false,boundary:true"
          ]
          missing=[item for item in required if item not in source]
          assert not missing, missing
          assert "damageBreakablesAround(ax+f.ux*f.len*.5" not in source
          digest=hashlib.sha256(source.encode()).hexdigest()
          assert digest=='86fdcfc3cbe1f25517d44c71ac3c4aa37f7dc677816d7ea25df3bee30f3b20a8', digest
          PY
      - name: Build compressed runtime and loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, textwrap
          raw=Path('tmp-runtime/runtime-v034f.js').read_bytes()
          encoded=base64.b64encode(gzip.compress(raw, compresslevel=9, mtime=0)).decode()
          size=(len(encoded)+3)//4
          out=Path('v034f'); out.mkdir(exist_ok=True)
          chunks=[encoded[i*size:(i+1)*size] for i in range(4)]
          for i,chunk in enumerate(chunks,1):
              wrapped='\n'.join(textwrap.wrap(chunk,120))+'\n'
              (out/f'game.gz.part{i:02}.txt').write_text(wrapped)
          rebuilt=gzip.decompress(base64.b64decode(''.join(p.read_text().strip().replace('\n','') for p in sorted(out.glob('game.gz.part*.txt')))))
          assert rebuilt==raw
          html=Path('Living_Hospital_v0.3.4.e.html').read_text()
          html=html.replace('Living Hospital v0.3.4.e', 'Living Hospital v0.3.4.f')
          html=html.replace('v034e/game.gz.part', 'v034f/game.gz.part')
          Path('Living_Hospital_v0.3.4.f.html').write_text(html)
          for name in ('index.html','playtest.html'):
              path=Path(name)
              if path.exists():
                  text=path.read_text()
                  text=text.replace('Living_Hospital_v0.3.4.e.html','Living_Hospital_v0.3.4.f.html')
                  text=text.replace('v0.3.4.e','v0.3.4.f')
                  path.write_text(text)
          print('runtime_sha256', hashlib.sha256(raw).hexdigest())
          PY
      - name: Commit generated version
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Living_Hospital_v0.3.4.f.html v034f index.html playtest.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'fix: build v0.3.4.f gameplay corrections'
            git push origin HEAD:fix/v034f-suture-map-spawn
          fi
