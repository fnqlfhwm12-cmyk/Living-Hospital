name: Build v0.3.4.e

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/build_v034e.mjs'
      - '.github/workflows/build-v034e.yml'
      - 'v034d/**'
      - 'Living_Hospital_v0.3.4.d.html'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v0.3.4.e
        run: node scripts/build_v034e.mjs
      - name: Validate repository
        run: node scripts/validate_repo.mjs
      - name: Commit generated build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Living_Hospital_v0.3.4.e.html stable-v034e.html index.html playtest.html v034e README.md AGENTS.md docs/PROJECT_STATUS.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'build: publish v0.3.4.e single-ward map'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
