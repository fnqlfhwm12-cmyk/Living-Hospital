<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Living Hospital Playtest Monitor</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0909; }
    #gameFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #100d0d; }
    #monitorToggle {
      position: fixed;
      z-index: 10001;
      left: 50%;
      top: max(42px, calc(env(safe-area-inset-top) + 35px));
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 999px;
      background: rgba(12,10,10,.68);
      color: rgba(255,255,255,.78);
      padding: 5px 10px;
      font: 700 11px/1 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      opacity: .34;
      -webkit-tap-highlight-color: transparent;
    }
    #monitorToggle:active, #monitorToggle.open { opacity: .92; }
    #monitorPanel {
      position: fixed;
      z-index: 10002;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      width: min(560px, 92vw);
      max-height: min(82vh, 620px);
      overflow: auto;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 14px;
      background: rgba(22,17,17,.97);
      color: #fff;
      padding: 14px;
      box-shadow: 0 16px 48px rgba(0,0,0,.65);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    #monitorPanel.open { display: block; }
    #monitorPanel h1 { margin: 0 0 10px; font-size: 17px; }
    #summary { white-space: pre-wrap; margin: 0 0 12px; padding: 10px; border-radius: 9px; background: #110e0e; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button, .actions a {
      flex: 1 1 120px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.64);
      border-radius: 9px;
      background: #2a2020;
      color: #fff;
      padding: 10px 12px;
      text-align: center;
      text-decoration: none;
      font: 700 13px/1.1 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    #status { min-height: 18px; margin-top: 9px; font-size: 12px; opacity: .78; }
    #shade { position: fixed; z-index: 10000; inset: 0; display: none; background: rgba(0,0,0,.48); }
    #shade.open { display: block; }
  </style>
</head>
<body>
  <iframe id="gameFrame" title="Living Hospital" src="./Living_Hospital_v0.3.3.t.html" allow="autoplay; fullscreen"></iframe>
  <div id="shade"></div>
  <button id="monitorToggle" type="button" aria-label="플레이테스트 기록 열기">기록</button>
  <section id="monitorPanel" aria-label="플레이테스트 기록">
    <h1>플레이테스트 기록</h1>
    <pre id="summary">게임을 불러오는 중…</pre>
    <div class="actions">
      <button id="copyBtn" type="button">보고서 복사</button>
      <button id="shareBtn" type="button">공유</button>
      <button id="resetBtn" type="button">기록 초기화</button>
      <button id="closeBtn" type="button">닫기</button>
      <a href="./Living_Hospital_v0.3.3.t.html">일반 플레이 열기</a>
    </div>
    <div id="status" role="status"></div>
  </section>

  <script>
    (() => {
      'use strict';

      const GAME_FILE = 'Living_Hospital_v0.3.3.t.html';
      const REPORT_FORMAT = 1;
      const frame = document.getElementById('gameFrame');
      const toggle = document.getElementById('monitorToggle');
      const panel = document.getElementById('monitorPanel');
      const shade = document.getElementById('shade');
      const summary = document.getElementById('summary');
      const status = document.getElementById('status');

      const state = {
        startedAt: new Date(),
        resetAt: new Date(),
        frameLoadedAt: null,
        fpsSamples: [],
        latestFps: null,
        minFps: null,
        avgFps: null,
        longTasks: 0,
        longTaskMs: 0,
        errors: [],
        rejections: [],
        touches: 0,
        visibilityChanges: 0,
        orientationChanges: 0,
        loadCount: 0,
      };

      let rafFrames = 0;
      let rafWindowStart = performance.now();
      let childLongTaskObserver = null;

      function clampText(value, max = 1200) {
        const text = String(value ?? '');
        return text.length > max ? `${text.slice(0, max)}…` : text;
      }

      function recordError(kind, message, source = '', line = 0, column = 0) {
        const target = kind === 'rejection' ? state.rejections : state.errors;
        target.push({
          at: new Date().toISOString(),
          message: clampText(message, 800),
          source: clampText(source, 300),
          line,
          column,
        });
        if (target.length > 20) target.shift();
      }

      function sampleFps(now) {
        rafFrames += 1;
        const elapsed = now - rafWindowStart;
        if (elapsed >= 1000) {
          const fps = Math.round((rafFrames * 1000 / elapsed) * 10) / 10;
          state.latestFps = fps;
          state.fpsSamples.push(fps);
          if (state.fpsSamples.length > 600) state.fpsSamples.shift();
          state.minFps = Math.min(...state.fpsSamples);
          state.avgFps = Math.round((state.fpsSamples.reduce((a, b) => a + b, 0) / state.fpsSamples.length) * 10) / 10;
          rafFrames = 0;
          rafWindowStart = now;
          if (panel.classList.contains('open')) render();
        }
        requestAnimationFrame(sampleFps);
      }
      requestAnimationFrame(sampleFps);

      function childText(selector) {
        try {
          return clampText(frame.contentDocument?.querySelector(selector)?.textContent?.trim() ?? '', 1000);
        } catch {
          return '';
        }
      }

      function currentOrientation() {
        const screenType = screen.orientation?.type;
        if (screenType) return screenType;
        return innerWidth >= innerHeight ? 'landscape' : 'portrait';
      }

      function snapshot() {
        const now = new Date();
        const sessionSeconds = Math.max(0, Math.round((now - state.resetAt) / 1000));
        let gameTitle = '';
        let gameUrl = GAME_FILE;
        try {
          gameTitle = frame.contentDocument?.title ?? '';
          gameUrl = frame.contentWindow?.location?.pathname?.split('/').pop() || GAME_FILE;
        } catch {
          gameTitle = '';
        }
        return {
          reportFormat: REPORT_FORMAT,
          generatedAt: now.toISOString(),
          gameFile: gameUrl,
          gameTitle,
          gameTimer: childText('#timer'),
          gameDebug: childText('#debug'),
          sessionSeconds,
          monitoringStartedAt: state.startedAt.toISOString(),
          recordResetAt: state.resetAt.toISOString(),
          frameLoadedAt: state.frameLoadedAt?.toISOString() ?? null,
          loadCount: state.loadCount,
          performance: {
            latestFps: state.latestFps,
            averageFps: state.avgFps,
            minimumFps: state.minFps,
            fpsSamples: state.fpsSamples.length,
            longTasks: state.longTasks,
            longTaskTotalMs: Math.round(state.longTaskMs),
          },
          interaction: {
            touches: state.touches,
            visibilityChanges: state.visibilityChanges,
            orientationChanges: state.orientationChanges,
          },
          environment: {
            userAgent: navigator.userAgent,
            language: navigator.language,
            viewport: `${innerWidth}x${innerHeight}`,
            screen: `${screen.width}x${screen.height}`,
            devicePixelRatio: devicePixelRatio,
            orientation: currentOrientation(),
            standalone: Boolean(navigator.standalone || matchMedia('(display-mode: standalone)').matches),
          },
          errors: state.errors,
          unhandledRejections: state.rejections,
        };
      }

      function markdownReport(data = snapshot()) {
        const formatSeconds = (seconds) => {
          const min = String(Math.floor(seconds / 60)).padStart(2, '0');
          const sec = String(seconds % 60).padStart(2, '0');
          return `${min}:${sec}`;
        };
        const errorLines = data.errors.length
          ? data.errors.map((item, index) => `${index + 1}. ${item.message} (${item.source || 'unknown'}:${item.line || 0})`).join('\n')
          : '없음';
        const rejectionLines = data.unhandledRejections.length
          ? data.unhandledRejections.map((item, index) => `${index + 1}. ${item.message}`).join('\n')
          : '없음';
        return `# Living Hospital 플레이테스트 보고서\n\n` +
          `- 생성 시각: ${data.generatedAt}\n` +
          `- 게임 파일: ${data.gameFile}\n` +
          `- 게임 제목: ${data.gameTitle || '확인 불가'}\n` +
          `- 기록 시간: ${formatSeconds(data.sessionSeconds)}\n` +
          `- 게임 타이머: ${data.gameTimer || '확인 불가'}\n` +
          `- 평균 FPS: ${data.performance.averageFps ?? '표본 부족'}\n` +
          `- 최저 FPS: ${data.performance.minimumFps ?? '표본 부족'}\n` +
          `- 최근 FPS: ${data.performance.latestFps ?? '표본 부족'}\n` +
          `- Long Task: ${data.performance.longTasks}회 / ${data.performance.longTaskTotalMs}ms\n` +
          `- 터치 입력: ${data.interaction.touches}회\n` +
          `- 화면 방향 변경: ${data.interaction.orientationChanges}회\n` +
          `- 화면 숨김·복귀: ${data.interaction.visibilityChanges}회\n` +
          `- 환경: ${data.environment.viewport}, DPR ${data.environment.devicePixelRatio}, ${data.environment.orientation}\n` +
          `- 사용자 환경: ${data.environment.userAgent}\n\n` +
          `## 게임 디버그 표시\n\n${data.gameDebug || '없음'}\n\n` +
          `## JavaScript 오류\n\n${errorLines}\n\n` +
          `## 처리되지 않은 Promise 오류\n\n${rejectionLines}\n\n` +
          `## 체감 메모\n\n- 난이도:\n- 조작감:\n- 공격 판독성:\n- 발열·프레임 체감:\n- 재현 시점:\n- 수정 필요 사항:\n`;
      }

      function render() {
        const data = snapshot();
        summary.textContent = [
          `빌드  ${data.gameFile}`,
          `시간  ${Math.floor(data.sessionSeconds / 60)}분 ${data.sessionSeconds % 60}초 · 게임 ${data.gameTimer || '—'}`,
          `FPS   평균 ${data.performance.averageFps ?? '—'} · 최저 ${data.performance.minimumFps ?? '—'} · 최근 ${data.performance.latestFps ?? '—'}`,
          `지연  Long Task ${data.performance.longTasks}회 / ${data.performance.longTaskTotalMs}ms`,
          `입력  터치 ${data.interaction.touches}회 · 방향 변경 ${data.interaction.orientationChanges}회`,
          `오류  JS ${data.errors.length}건 · Promise ${data.unhandledRejections.length}건`,
          `화면  ${data.environment.viewport} · DPR ${data.environment.devicePixelRatio}`,
        ].join('\n');
      }

      function setOpen(open) {
        panel.classList.toggle('open', open);
        shade.classList.toggle('open', open);
        toggle.classList.toggle('open', open);
        if (open) render();
      }

      async function copyText(text) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand('copy');
        area.remove();
        if (!ok) throw new Error('복사 기능을 사용할 수 없습니다.');
      }

      function attachChildMonitoring() {
        state.loadCount += 1;
        state.frameLoadedAt = new Date();
        try {
          const childWindow = frame.contentWindow;
          const childDocument = frame.contentDocument;
          childWindow.addEventListener('error', (event) => {
            recordError('error', event.message || event.error || '알 수 없는 오류', event.filename, event.lineno, event.colno);
          });
          childWindow.addEventListener('unhandledrejection', (event) => {
            recordError('rejection', event.reason?.stack || event.reason?.message || event.reason || '알 수 없는 Promise 오류');
          });
          childDocument.addEventListener('touchstart', (event) => {
            state.touches += Math.max(1, event.touches?.length ?? 1);
          }, { passive: true, capture: true });
          childDocument.addEventListener('pointerdown', (event) => {
            if (event.pointerType !== 'touch') state.touches += 1;
          }, { passive: true, capture: true });

          if (childWindow.PerformanceObserver) {
            childLongTaskObserver?.disconnect?.();
            childLongTaskObserver = new childWindow.PerformanceObserver((list) => {
              for (const entry of list.getEntries()) {
                state.longTasks += 1;
                state.longTaskMs += entry.duration || 0;
              }
            });
            childLongTaskObserver.observe({ type: 'longtask', buffered: true });
          }
        } catch (error) {
          recordError('error', `모니터 연결 실패: ${error.message || error}`);
        }
        render();
      }

      frame.addEventListener('load', attachChildMonitoring);
      window.addEventListener('error', (event) => {
        recordError('error', event.message || event.error || '모니터 오류', event.filename, event.lineno, event.colno);
      });
      window.addEventListener('unhandledrejection', (event) => {
        recordError('rejection', event.reason?.stack || event.reason?.message || event.reason || '모니터 Promise 오류');
      });
      document.addEventListener('visibilitychange', () => { state.visibilityChanges += 1; });
      window.addEventListener('orientationchange', () => { state.orientationChanges += 1; });
      screen.orientation?.addEventListener?.('change', () => { state.orientationChanges += 1; });

      toggle.addEventListener('click', () => setOpen(!panel.classList.contains('open')));
      shade.addEventListener('click', () => setOpen(false));
      document.getElementById('closeBtn').addEventListener('click', () => setOpen(false));
      document.getElementById('copyBtn').addEventListener('click', async () => {
        try {
          await copyText(markdownReport());
          status.textContent = '보고서를 복사했습니다. ChatGPT 대화나 GitHub Issue에 붙여 넣으면 됩니다.';
        } catch (error) {
          status.textContent = `복사 실패: ${error.message || error}`;
        }
      });
      document.getElementById('shareBtn').addEventListener('click', async () => {
        const text = markdownReport();
        try {
          if (navigator.share) {
            await navigator.share({ title: 'Living Hospital 플레이테스트 보고서', text });
            status.textContent = '공유 메뉴를 열었습니다.';
          } else {
            await copyText(text);
            status.textContent = '공유 기능이 없어 보고서를 복사했습니다.';
          }
        } catch (error) {
          if (error?.name !== 'AbortError') status.textContent = `공유 실패: ${error.message || error}`;
        }
      });
      document.getElementById('resetBtn').addEventListener('click', () => {
        state.resetAt = new Date();
        state.fpsSamples.length = 0;
        state.latestFps = null;
        state.minFps = null;
        state.avgFps = null;
        state.longTasks = 0;
        state.longTaskMs = 0;
        state.errors.length = 0;
        state.rejections.length = 0;
        state.touches = 0;
        state.visibilityChanges = 0;
        state.orientationChanges = 0;
        status.textContent = '기록을 초기화했습니다. 게임 진행 상태는 유지됩니다.';
        render();
      });

      render();
      setInterval(() => {
        if (panel.classList.contains('open')) render();
      }, 1000);
    })();
  </script>
</body>
</html>
