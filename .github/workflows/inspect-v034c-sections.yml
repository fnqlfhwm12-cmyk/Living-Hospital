name: Inspect v0.3.4.c sections
on:
  push:
    paths:
      - .github/workflows/inspect-v034c-sections.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/inspect_v034c_sections.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/v034c-lines-*.txt
          git diff --cached --quiet || git commit -m "chore: publish v0.3.4.c section inspection"
          git push
