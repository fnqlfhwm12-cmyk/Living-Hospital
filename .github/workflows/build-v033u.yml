name: Build v0.3.3.u

on:
  push:
    branches:
      - feature/v033u-auto-report
    paths:
      - scripts/build_v033u.mjs
      - scripts/v033u_telemetry.js
      - scripts/v033u_playtest.html
      - .github/workflows/build-v033u.yml
      - .github/v033u-trigger
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: build-v033u-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v033u-auto-report

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate v0.3.3.u
        run: node scripts/build_v033u.mjs

      - name: Validate generated repository
        run: node scripts/validate_repo.mjs

      - name: Commit generated files
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Living_Hospital_v0.3.3.u.html playtest.html index.html README.md AGENTS.md docs/PROJECT_STATUS.md docs/CHANGELOG.md docs/PLAYTESTING.md
          git commit -m "v0.3.3.u: 자동 플레이 종료 및 오류 기록"
          git push origin HEAD:feature/v033u-auto-report
