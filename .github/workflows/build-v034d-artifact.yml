name: Build v0.3.4.d artifact
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v034d
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch build script
        run: |
          node scripts/patch_build_v034d.mjs
          node scripts/patch_build_v034d_validation.mjs
      - name: Generate v0.3.4.d
        run: node scripts/build_v034d.mjs
      - name: Validate generated build
        run: node scripts/validate_repo.mjs
      - name: Commit generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Living_Hospital_v0.3.4.d.html v034d index.html stable-v034d.html playtest.html README.md AGENTS.md docs/PROJECT_STATUS.md docs/CHANGELOG.md UPDATE_v0.3.4.d.md
          git diff --cached --quiet || git commit -m "build: publish v0.3.4.d pathfinding and rewards"
          git push origin HEAD:build/v034d
