name: Build v0.3.4.d
on:
  push:
    paths:
      - .github/workflows/build-v034d.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.3.4.d
        run: node scripts/build_v034d.mjs
      - name: Validate repository
        run: node scripts/validate_repo.mjs
      - name: Commit build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Living_Hospital_v0.3.4.d.html v034d index.html stable-v034d.html playtest.html README.md AGENTS.md docs/PROJECT_STATUS.md docs/CHANGELOG.md UPDATE_v0.3.4.d.md
          git diff --cached --quiet || git commit -m "build: publish v0.3.4.d pathfinding and rewards"
          git push
