name: Build v0.4.0.d maze extermination rooms

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v040d-maze-extermination
    paths:
      - scripts/build_v040d.mjs
      - scripts/v040d/**
      - .github/workflows/build-v040d.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v040d-maze-extermination
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate v0.4.0.d
        run: node scripts/build_v040d.mjs
      - name: Validate repository
        run: node scripts/validate_repo.mjs
      - name: Commit generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v0.4.0.d: randomized maze and extermination room family"
          git push origin HEAD:agent/v040d-maze-extermination
