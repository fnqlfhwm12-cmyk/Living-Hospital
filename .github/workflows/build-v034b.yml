name: Build v0.3.4.b minimap
on:
  push:
    paths:
      - .github/workflows/build-v034b.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate player-centered minimap build
        run: node scripts/build_v034b.mjs
      - name: Commit generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v034b Living_Hospital_v0.3.4.b.html index.html stable-v034b.html
          git diff --cached --quiet || git commit -m "build: publish v0.3.4.b player-centered minimap"
          git push
