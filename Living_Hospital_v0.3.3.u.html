<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Living Hospital Prototype v0.3.3.u</title>
<style>
:root{color-scheme:dark;--app-width:100vw;--app-height:100vh}
@supports(height:100dvh){:root{--app-height:100dvh}}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d0d;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0;width:var(--app-width);height:var(--app-height);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#fff}
canvas{display:block;width:var(--app-width);height:var(--app-height);background:#181212}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .16s}body.organ-cinematic #hud{opacity:0}
#topLeft{position:absolute;left:max(9px,env(safe-area-inset-left));top:max(7px,env(safe-area-inset-top));display:grid;grid-template-columns:36px 148px;align-items:center;gap:6px}
#barStack{display:grid;gap:4px;width:148px}
.statusRow{display:block;width:100%}.bar{height:7px;border:1px solid #ffffffa8;background:#251d1de8;margin:0;border-radius:5px;overflow:hidden;box-shadow:0 1px 5px #0008}
.fill{height:100%;background:#d65454}.xp{background:#e5e5e5}
#organHud{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.organSlot{position:relative;width:34px;height:34px;border:1px solid #777;border-radius:9px;background:#171414e8;display:flex;align-items:center;justify-content:center;box-sizing:border-box;font-size:20px;font-weight:850;box-shadow:0 0 10px #000a;overflow:hidden}
.organSlot.equipped{border:2px solid #f2f2f2}.organSlot.empty{opacity:.42}.organSigil{filter:drop-shadow(0 0 5px currentColor);transform:translateY(-.5px)}.organDot{position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 5px currentColor}
#topCenter{position:absolute;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;font-weight:750;pointer-events:none}
#timer{min-width:52px;padding:3px 7px;border:1px solid #ffffff62;border-radius:7px;background:#130f0fba;font-size:12px;letter-spacing:.5px;box-shadow:0 2px 8px #0007}
#pause{pointer-events:auto;position:absolute;right:max(10px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #fff;border-radius:9px;background:#241d1de8;color:#fff;padding:0;font-size:17px;font-weight:800;line-height:1}
#minimap{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(50px,calc(env(safe-area-inset-top) + 43px));width:124px;height:88px;border:1px solid #ffffff88;border-radius:8px;background:#090909e6;box-sizing:border-box}
#debug{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(144px,calc(env(safe-area-inset-top) + 137px));text-align:right;font-size:10px;opacity:.72}
#toast{position:absolute;left:50%;top:max(88px,calc(env(safe-area-inset-top) + 80px));transform:translateX(-50%);min-width:240px;max-width:68vw;text-align:center;font-weight:720;font-size:12px;line-height:1.25;opacity:0;background:#0b0b0be6;border:1px solid #fff6;border-radius:9px;padding:7px 11px;transition:opacity .16s;box-shadow:0 5px 18px #0009}
#actionButton{--action-accent:#d94d5b;pointer-events:auto;position:absolute;right:max(17px,env(safe-area-inset-right));bottom:max(15px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:2px solid #625d5b;background:#211d1c;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box;opacity:.28;transform:scale(.94);box-shadow:none;transition:opacity .16s,transform .16s,border-color .16s,background-color .16s;-webkit-tap-highlight-color:transparent}
#actionButton.ready{opacity:.94;transform:scale(1);border-color:var(--action-accent);background:var(--action-accent);box-shadow:0 0 0 2px #ffffff24;animation:actionHeartbeat 1.16s ease-in-out infinite}#actionButton:disabled{cursor:default}body.organ-cinematic #hud{pointer-events:none}
@keyframes actionHeartbeat{0%,36%,100%{transform:scale(1)}14%{transform:scale(1.10)}24%{transform:scale(1.025)}30%{transform:scale(1.075)}}
#overlay,#rotateScreen,#startScreen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000d;padding:14px}
#startScreen{display:flex;background:#110e0e}
#panel,#startCard,#rotateCard{width:min(920px,94vw);max-height:90vh;overflow:auto;background:#211818;border:2px solid #fff;border-radius:16px;padding:16px;box-sizing:border-box}
#panel.selectionMode{display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;overflow:auto;min-height:0;padding:2px}
.card{background:#312323;color:#fff;border:1px solid #aaa;border-radius:13px;padding:12px;min-height:124px;min-width:0;max-width:100%;box-sizing:border-box;overflow:hidden;text-align:left;display:flex;flex-direction:column;align-items:stretch;transition:transform .12s,border-color .12s,box-shadow .12s,background-color .12s;-webkit-tap-highlight-color:transparent}
.card.selected{border:2px solid #fff;background:#3d2929;box-shadow:0 0 0 2px #ffffff22,0 8px 24px #0008;transform:translateY(-2px)}
.card small,.card h3,.card p{min-width:0;max-width:100%}.card small{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card h3{margin:6px 0 3px;line-height:1.18;overflow-wrap:anywhere;word-break:keep-all}.card p{margin:5px 0 0;font-size:12px;line-height:1.30;overflow:visible;overflow-wrap:anywhere;word-break:keep-all;display:block}.cardIcon{font-size:29px;line-height:1;margin-bottom:4px;flex:0 0 auto}
#selectionFooter{display:none;align-items:center;justify-content:center;gap:10px;padding-top:12px;min-height:46px}
#selectionFooter.visible{display:flex}
#confirmSelectionBtn{min-width:138px}
#confirmSelectionBtn:disabled{opacity:.28;border-color:#706969;background:#1b1717}
#selectionCancelBtn{min-width:112px;opacity:.82}
#overlay.organPreview{background:transparent;padding:0;align-items:flex-end}
#overlay.organPreview #panel{width:100%;max-height:none;border:0;border-radius:0;background:linear-gradient(180deg,transparent 0%,rgba(10,7,8,.18) 18%,rgba(17,12,13,.92) 52%,rgba(17,12,13,.98) 100%);padding:0 16px max(12px,env(safe-area-inset-bottom));display:block;overflow:visible}
#overlay.organPreview #overlayTitle,#overlay.organPreview #cards{display:none!important}
#overlay.organPreview #selectionFooter{display:flex;padding-top:74px}
#overlay.organPreview #confirmSelectionBtn{border-color:#fff;background:#efe9df;color:#171212}
#overlay.organPreview #selectionCancelBtn{background:#231d1d}
.btn{pointer-events:auto;border:1px solid #fff;background:#262020;color:#fff;border-radius:11px;padding:11px 16px;font-size:16px;font-weight:700}
#pauseMenu{display:none;text-align:left}
#pauseSummary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.pauseSection{background:#171313;border:1px solid #ffffff45;border-radius:12px;padding:11px;min-height:122px;box-sizing:border-box}
.pauseSection h3{font-size:13px;margin:0 0 8px;color:#e9d7d7;letter-spacing:.2px}.pauseItem{display:grid;grid-template-columns:25px 1fr;gap:7px;align-items:start;padding:5px 0;border-top:1px solid #ffffff18}.pauseItem:first-of-type{border-top:0}.pauseItemIcon{font-size:18px;text-align:center}.pauseItem b{font-size:12px}.pauseItem p{margin:2px 0 0;font-size:10px;line-height:1.35;opacity:.72}.pauseEmpty{font-size:11px;opacity:.55;padding:8px 0}
.pauseActions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.settingBtn{min-width:138px}.settingBtn.off{opacity:.62;border-color:#9a7777}
.muted{opacity:.75}
@media (orientation:portrait){#rotateScreen{display:flex}}
@media (max-width:850px){#cards{grid-template-columns:repeat(2,1fr)}.card{min-height:104px}#pauseSummary{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pauseSection{padding:8px;min-height:106px}.pauseItem{grid-template-columns:21px 1fr;gap:5px;padding:4px 0}.pauseItemIcon{font-size:16px}}
@media (max-height:430px){#selectionFooter{padding-top:8px;min-height:40px}.card{min-height:86px;padding:8px}.cardIcon{font-size:24px}.card h3{margin:4px 0 2px;font-size:14px}.card p{margin:3px 0 0;font-size:10.5px;line-height:1.22}.btn{padding:9px 14px;font-size:14px}#overlay.organPreview #selectionFooter{padding-top:54px}#actionButton{width:52px;height:52px;right:max(13px,env(safe-area-inset-right));bottom:max(11px,env(safe-area-inset-bottom))}#topLeft{grid-template-columns:33px 137px}#barStack{width:137px}#organHud{width:33px;height:33px}.organSlot{width:32px;height:32px;font-size:18px}#pause,#timer{transform:scale(.94);transform-origin:top center}#panel{max-height:94vh;padding:12px}#pauseSummary{margin-bottom:9px}.pauseSection{min-height:96px}.pauseItem p{font-size:9px}#toast{top:max(78px,calc(env(safe-area-inset-top) + 70px))}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="topLeft">
    <div id="organHud" aria-label="메인 장기"></div>
    <div id="barStack">
      <div class="statusRow"><div class="bar" aria-label="체력"><div id="hpFill" class="fill"></div></div></div>
      <div class="statusRow"><div class="bar" aria-label="경험치"><div id="xpFill" class="fill xp"></div></div></div>
    </div>
  </div>
  <div id="topCenter"><div id="timer">00:00</div></div>
  <button id="pause" aria-label="일시정지">Ⅱ</button>
  <canvas id="minimap" width="124" height="88" aria-label="미니맵"></canvas>
  <div id="debug"></div>
  <div id="toast"></div>
  <button id="actionButton" aria-label="사용 가능한 상호작용 없음" disabled></button>
</div>

<div id="overlay">
  <div id="panel">
    <h2 id="overlayTitle">성장 선택</h2>
    <div id="cards"></div>
    <div id="selectionFooter">
      <button class="btn" id="selectionCancelBtn">보류</button>
      <button class="btn" id="confirmSelectionBtn" disabled>확인</button>
    </div>
    <div id="pauseMenu">
      <div id="pauseSummary"></div>
      <div class="pauseActions">
        <button class="btn settingBtn" id="audioToggleBtn">음향 켜짐</button>
        <button class="btn" id="resumeBtn">계속하기</button>
        <button class="btn" id="restartBtn">재시작</button>
      </div>
    </div>
  </div>
</div>

<div id="rotateScreen">
  <div id="rotateCard" style="text-align:center;">
    <h2>기기를 가로로 돌려주세요</h2>
    <p class="muted">세로 화면에서는 플레이가 자동으로 멈춥니다.</p>
  </div>
</div>

<div id="startScreen">
  <div id="startCard" style="text-align:center;">
    <h1>Living Hospital</h1>
    <h2>Prototype v0.3.3.u · 자동 플레이 기록 · 오류 계측</h2>
    <p>육체는 여덟 번 무기를 기억하고, 일곱 번 스스로를 변형합니다. 가까이 남은 것들은 천천히 당신에게 돌아옵니다.</p>
    <p class="muted">플레이 종료 자동 보고 · 치명 오류 자동 기록 · 성능 이상 감지 · t 전투 기준 유지</p>
    <button class="btn" id="startBtn">테스트 시작</button>
  </div>
</div>

<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={};['hpFill','xpFill','timer','debug','organHud','pause','overlay','panel','overlayTitle','cards','selectionFooter','selectionCancelBtn','confirmSelectionBtn','pauseMenu','pauseSummary','audioToggleBtn','resumeBtn','restartBtn','startScreen','startBtn','toast','minimap','actionButton'].forEach(id=>ui[id]=document.getElementById(id));
const minimapCtx=ui.minimap.getContext('2d',{alpha:false});
const minimapStatic=document.createElement('canvas'),minimapStaticCtx=minimapStatic.getContext('2d',{alpha:false});

let W=0,H=0,DPR=1,last=0,running=false,paused=false,growthChoosing=false,gameOver=false;
let elapsed=0,spawnTimer=0,fps=60,fpsAcc=0,fpsFrames=0,kills=0,frameTick=0,qualityLevel=0,qualityClock=0,qualityLowStreak=0,qualityHighStreak=0,minimapClock=0,hudClock=0,debugClock=0,orbMergeClock=0,pickupAuditClock=0;
let minFps=60,slowFrames=0,maxEnemies=0,maxOrbs=0,maxFrameMs=0,frameMsSum=0,frameSamples=0,hitVignette=0;
let enemies=[],projectiles=[],waves=[],slashes=[],boneShards=[],boneImpactFx=[],shockFx=[],leechFx=[],bloodWrapFx=[],brainLinks=[],enemyShots=[],orbs=[],organDrops=[],pickups=[],pickupRespawns=[],particles=[],landmarks=[],objects=[],zones=[],events=[],hazards=[],clotFields=[],clotCritFx=[],clotReleaseFx=[],corpses=[],deathFx=[],breaches=[],navGates=[];
let eventClock=125,eventCount=0,broadcastTimer=0,broadcastText='',broadcastMode='normal',toastTimer=0,anomalyClock=185,anomalyCount=0,waveSerial=0,currentWave=null,lastEventHospital=null,growthCount=0,currentAction=null;
const joystick={active:false,id:null,sx:0,sy:0,x:0,y:0,dx:0,dy:0,max:72};
const keys={};
const camera={x:0,y:0},renderCamera={x:0,y:0};
const PERF={targetFps:60,enemyCap:150,gridSize:128,objectGridSize:192,cullMargin:110,dpr:[1.5,1.25,1],minimapInterval:[.15,.22,.30]};
const SCALE={player:.90,enemy:.80,eliteEnemy:.88,projectile:.75,item:.85,object:.85,landmark:.85,effect:.75,particle:.75};
const ORB_BASE_R=4.9,ORB_MAX_R=9.5,ORB_GROWTH=.85;
const MINIMAP={w:124,h:88,pad:5,minX:-2050,maxX:2050,minY:-1150,maxY:1150,baseInterval:.15};
const enemyGrid=new Map(),objectGrid=new Map();
const enemyQueryBuffer=[],objectQueryBuffer=[],enemyBucketPool=[],objectBucketPool=[];
const POOLS={enemy:[],projectile:[],enemyShot:[],orb:[],organDrop:[],pickup:[],particle:[],corpse:[],deathFx:[]};
const screenPoints=Array.from({length:64},()=>({x:0,y:0}));
let screenPointIndex=0,querySerial=1,vignetteGradient=null;
let accumulator=0,loopClock=0,audioCtx=null,audioMaster=null,audioCompressor=null,soundEnabled=true,lastPickupTone=0,lastPlayerHitTone=0,lastBoneHitTone=0,lastBloodHitTone=0,transplantInside=false,transplantNear=false,transplantReady=false,transplantCooldown=0,transplantOpen=false,organSerial=0,cinematicAudioNodes=[];
let activeOrgan=null,organStored={},organFx=0,organFlash='#fff',cameraShake=0,brainClock=8,stomachClock=20,heartBeatClock=4,globalMagnet=0,defibrillatorTimer=0,defibrillatorPulseClock=0,defibrillatorAimX=1,defibrillatorAimY=0,waterReaction=0,bodyTwitch=0,clotTrailClock=0,clotStillClock=0,clotLastX=0,clotLastY=0,clotHadMotion=false,clotArmed=false,clotMoveTime=0,clotMoveDistance=0,clotPrevX=0,clotPrevY=0,clotBurst=null,clotGroupSerial=0,clotCritSerial=0,bloodStreamSerial=0,enemySerial=0;
let organCinematicTimer=0,organCinematicSlot=null,organCinematicPreview=false,organPreviewElapsed=0,organPulse=0,organPulseSlot=null,organRings=[];
let selectionMode=null,selectedChoice=null,selectionConfirmAction=null,selectionCancelAction=null,selectionInputGuardUntil=0,selectionNeedsFreshPointer=false;
let hitStopTimer=0,boneSwingSide=1;
const PERF_WARMUP=4,ORGAN_CINEMATIC_DURATION=3.7,MAX_MAP_PICKUPS=3,PICKUP_RESPAWN_MIN=20,PICKUP_RESPAWN_MAX=35;
const CLOT_FIELD_CAP=28,CLOT_CRIT_FX_CAP=4;
const LH_PLAYTEST_PROTOCOL='LH_PLAYTEST_V1',LH_BUILD='Living_Hospital_v0.3.3.u.html';
let playtestRunStartedAt='',playtestIncidents=[],playtestIncidentAt=new Map(),playtestHealthClock=0,playtestLowFpsSeconds=0,playtestCriticalFpsSeconds=0,playtestFinished=false,playtestLastSnapshot=null;
function postPlaytest(type,payload={}){
 try{if(window.parent&&window.parent!==window)window.parent.postMessage({protocol:LH_PLAYTEST_PROTOCOL,type,build:LH_BUILD,at:new Date().toISOString(),payload},location.origin);}catch(_){}
}
function playtestLoadout(){
 const weaponLevels={};for(const [key,w] of Object.entries(weapons))weaponLevels[key]=w.level;
 const passiveLevels={};for(const [key,p] of Object.entries(passives))passiveLevels[key]=p.level;
 return{activeOrgan:activeOrgan||null,storedOrgans:Object.keys(organStored),weapons:weaponLevels,passives:passiveLevels};
}
function collectPlaytestSnapshot(reason='snapshot',completed=null){
 const avgMs=frameSamples?frameMsSum/frameSamples:0;
 return{
  reason,completed,build:LH_BUILD,generatedAt:new Date().toISOString(),runStartedAt:playtestRunStartedAt||null,
  gameTime:Math.max(0,elapsed),gameTimeText:fmt(elapsed),kills,best:Math.max(best,elapsed),
  performance:{currentFps:Number(fps.toFixed(1)),minimumFps:Number(minFps.toFixed(1)),averageFrameMs:Number(avgMs.toFixed(2)),maximumFrameMs:Number(maxFrameMs.toFixed(2)),slowFrames,qualityLevel},
  counts:{enemies:enemies.length,maxEnemies,orbs:orbs.length,maxOrbs,projectiles:projectiles.length,enemyShots:enemyShots.length,waves:waves.length,particles:particles.length,clotFields:clotFields.length,clotCritFx:clotCritFx.length,organDrops:organDrops.length,pickups:pickups.length,objects:objects.filter(o=>o.active).length},
  player:{hp:Number(player.hp.toFixed(2)),maxHp:Number(player.maxHp.toFixed(2)),shield:Number(player.shield.toFixed(2)),x:Number(player.x.toFixed(1)),y:Number(player.y.toFixed(1)),crit:Number(player.crit.toFixed(3)),damageTakenMult:Number(player.damageTakenMult.toFixed(3))},
  world:{activeHospitals:hospitals.filter(h=>h.active).map(h=>h.id),eventCount,anomalyCount,growthCount},
  loadout:playtestLoadout(),incidents:playtestIncidents.map(x=>({...x}))
 };
}
function resetPlaytestRun(){
 playtestRunStartedAt=new Date().toISOString();playtestIncidents.length=0;playtestIncidentAt.clear();playtestHealthClock=0;playtestLowFpsSeconds=0;playtestCriticalFpsSeconds=0;playtestFinished=false;playtestLastSnapshot=null;window.__LH_PLAYTEST_LAST__=null;
}
function beginPlaytestRun(){resetPlaytestRun();postPlaytest('LH_RUN_STARTED',{build:LH_BUILD,startedAt:playtestRunStartedAt});}
function recordPlaytestIncident(code,severity='warning',detail='',force=false){
 const now=performance.now(),lastAt=playtestIncidentAt.get(code)||-Infinity,cooldown=severity==='fatal'?1000:10000;if(!force&&now-lastAt<cooldown)return null;playtestIncidentAt.set(code,now);
 const incident={code,severity,detail:String(detail||'').slice(0,900),at:new Date().toISOString(),gameTime:Number(elapsed.toFixed(2)),gameTimeText:fmt(elapsed)};
 playtestIncidents.push(incident);if(playtestIncidents.length>40)playtestIncidents.shift();
 const snapshot=collectPlaytestSnapshot(code,null);playtestLastSnapshot=snapshot;window.__LH_PLAYTEST_LAST__=snapshot;postPlaytest('LH_INCIDENT',{incident,snapshot});return incident;
}
function trackPlaytestFrame(rawMs){
 if(document.hidden||paused||gameOver||elapsed<PERF_WARMUP||rawMs>3000)return;
 if(rawMs>500)recordPlaytestIncident('frame-freeze','critical',`단일 프레임 ${rawMs.toFixed(1)}ms`);
 else if(rawMs>250)recordPlaytestIncident('frame-stall','warning',`단일 프레임 ${rawMs.toFixed(1)}ms`);
}
function updatePlaytestHealth(dt){
 playtestHealthClock-=dt;if(playtestHealthClock>0)return;playtestHealthClock=1;
 const finite=[elapsed,player.x,player.y,player.hp,player.maxHp,player.speed,fps].every(Number.isFinite);
 if(!finite){recordPlaytestIncident('invalid-number','fatal','게임 핵심 상태에서 NaN 또는 Infinity 감지',true);if(!gameOver)endGame(false,'invalid-state');return;}
 if(player.hp<0||player.hp>player.maxHp*1.5){recordPlaytestIncident('invalid-hp','fatal',`HP ${player.hp} / ${player.maxHp}`,true);if(!gameOver)endGame(false,'invalid-state');return;}
 if(elapsed>=PERF_WARMUP){
  if(fps<30)playtestLowFpsSeconds+=1;else if(fps>38)playtestLowFpsSeconds=Math.max(0,playtestLowFpsSeconds-2);
  if(fps<15)playtestCriticalFpsSeconds+=1;else playtestCriticalFpsSeconds=Math.max(0,playtestCriticalFpsSeconds-2);
  if(playtestLowFpsSeconds>=4){recordPlaytestIncident('sustained-low-fps','warning',`약 4초간 FPS ${fps.toFixed(1)} 미만`);playtestLowFpsSeconds=0;}
  if(playtestCriticalFpsSeconds>=2){recordPlaytestIncident('critical-low-fps','critical',`약 2초간 FPS ${fps.toFixed(1)}`);playtestCriticalFpsSeconds=0;}
 }
 const congested=enemies.reduce((n,e)=>n+(((e.stuckTimer||0)>3||(e.wallBlockedTime||0)>2)?1:0),0);
 if(congested>=8)recordPlaytestIncident('enemy-congestion','warning',`정체 의심 적 ${congested}개`);
 if(enemies.length>PERF.enemyCap+8)recordPlaytestIncident('enemy-cap-overflow','critical',`적 ${enemies.length} / 제한 ${PERF.enemyCap}`);
 if(projectiles.length>280)recordPlaytestIncident('projectile-overflow','warning',`투사체 ${projectiles.length}개`);
 if(particles.length>245)recordPlaytestIncident('particle-overflow','warning',`파티클 ${particles.length}개`);
 if(clotFields.length>CLOT_FIELD_CAP)recordPlaytestIncident('clot-field-overflow','warning',`혈흔 ${clotFields.length} / 제한 ${CLOT_FIELD_CAP}`);
}
function finalizePlaytestRun(reason,completed){
 if(playtestFinished)return;playtestFinished=true;const snapshot=collectPlaytestSnapshot(reason,!!completed);playtestLastSnapshot=snapshot;window.__LH_PLAYTEST_LAST__=snapshot;postPlaytest('LH_RUN_ENDED',snapshot);

function removePooledAt(a,i,name){const o=swapRemove(a,i);releasePool(name,o);}

  ctx.globalAlpha=.20*a;ctx.fillStyle='#d9b7ff';for(let i=0;i<6;i++){const gy=(p*H*1.7+i*73)%H,gh=2+(i%3)*3,shift=Math.sin(p*80+i)*W*.08;ctx.fillRect(Math.max(0,shift),gy,W-Math.abs(shift),gh);}
  ctx.globalAlpha=.20*a;ctx.font=`${baseIcon}px -apple-system,Apple Color Emoji,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(def.icon,iconX-7,iconY);ctx.fillText(def.icon,iconX+7,iconY);
 }else{
  const pull=1-Math.pow(1-p,2),wobble=Math.sin(p*23)*.04;iconScale=1+wobble;
  const g=ctx.createRadialGradient(cx,cy,baseIcon*.2,cx,cy,Math.max(W,H)*.62);g.addColorStop(0,`rgba(209,180,95,${.18*a})`);g.addColorStop(.32,`rgba(70,55,20,${.20*a})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

function updateHudDom(force=false){
 const hpW=(player.hp/player.maxHp*100).toFixed(1)+'%',xpW=(player.xp/player.nextGrowthXp*100).toFixed(1)+'%',time=fmt(elapsed);
 if(force||ui.hpFill.style.width!==hpW)ui.hpFill.style.width=hpW;

function updateDebugDom(){ui.debug.textContent=`FPS ${Math.round(fps)} · LOW ${Math.round(minFps)} · 지연 ${slowFrames} · Q${qualityLevel} · 적 ${enemies.length} · 혈흔 ${clotFields.length} · 응고 ${clotCritFx.length} · 구슬 ${orbs.length} · 장기 ${organDrops.length} · 아이템 ${pickups.length} · 풀 ${POOLS.enemy.length}/${POOLS.particle.length}`;}


function showPause(){if(gameOver||transplantOpen||organCinematicTimer>0||organCinematicPreview)return;clearSelectionUi();paused=true;syncActionButton();ui.overlay.style.display='flex';ui.overlayTitle.textContent='일시정지';ui.cards.style.display='none';ui.pauseMenu.style.display='block';renderPauseSummary();}
function hideOverlay(){if(organCinematicPreview)stopOrganPreview();ui.overlay.style.display='none';ui.cards.innerHTML='';ui.pauseMenu.style.display='none';clearSelectionUi();}
function endGame(completed=false,reason=completed?'time-limit':'player-death'){
 if(gameOver)return;gameOver=true;paused=true;stopOrganPreview();clearSelectionUi();best=Math.max(best,elapsed);localStorage.setItem('lh_best_v033u',String(best));
 const avgMs=frameSamples?frameMsSum/frameSamples:0,activeNames=hospitals.filter(h=>h.active).map(h=>h.short).join(' · ');
 ui.overlay.style.display='flex';ui.overlayTitle.textContent=completed?'10분 생존 성공':'실험체 사망';ui.cards.style.display='block';ui.pauseMenu.style.display='none';ui.cards.innerHTML=`<div style="text-align:center"><p>${completed?'테스트 제한 시간까지 생존했습니다.':'실험체가 더 이상 버티지 못했습니다.'}</p><p>활성 병동: ${activeNames}</p><p>메인 장기: ${activeOrgan?ORGAN_DEFS[activeOrgan].name:'없음'} · 보관 표본: ${organCount(organStored)}</p><p>생존 시간: ${fmt(elapsed)} · 처치 수: ${kills}</p><p>최고 기록: ${fmt(best)}</p><hr><p>최저 FPS: ${Math.round(minFps)} · 평균 프레임: ${avgMs.toFixed(1)}ms</p><p>최대 프레임 지연: ${maxFrameMs.toFixed(1)}ms · 33ms 초과: ${slowFrames}회</p><p>최대 동시 적: ${maxEnemies} · 최대 구슬: ${maxOrbs} · 최종 품질: Q${qualityLevel}</p><button class="btn" id="again">재시작</button></div>`;document.getElementById('again').onclick=()=>{reset();last=performance.now();loopClock=0;};finalizePlaytestRun(reason,completed);

function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function loop(now){
 if(!running)return;requestAnimationFrame(loop);if(!loopClock){loopClock=now;last=now;return;}const frameMs=1000/PERF.targetFps,rawDelta=now-loopClock,delta=Math.min(50,rawDelta);trackPlaytestFrame(rawDelta);if(delta<frameMs*.92)return;loopClock=now;
 if(!paused&&!gameOver&&elapsed>=PERF_WARMUP){const inst=1000/Math.max(1,rawDelta);minFps=Math.min(minFps,inst);maxFrameMs=Math.max(maxFrameMs,rawDelta);frameMsSum+=rawDelta;frameSamples++;if(rawDelta>33.3)slowFrames++;}
 const dt=delta/1000;if(organCinematicPreview)organPreviewElapsed+=dt;fpsAcc+=dt;fpsFrames++;if(fpsAcc>=.75){fps=fpsFrames/fpsAcc;fpsAcc=0;fpsFrames=0;}const portrait=matchMedia('(orientation:portrait)').matches;if(hitStopTimer>0&&!paused&&!portrait){hitStopTimer=Math.max(0,hitStopTimer-dt);accumulator=0;draw();return;}accumulator=Math.min(.05,accumulator+dt);if(!paused&&!portrait){let steps=0;while(accumulator>=1/60&&steps<3){update(1/60);accumulator-=1/60;steps++;}}else accumulator=0;draw();
}

function tStart(e){e.preventDefault();for(const t of e.changedTouches)if(t.clientX<W*.48&&!joystick.active){Object.assign(joystick,{active:true,id:t.identifier,sx:t.clientX,sy:t.clientY,x:t.clientX,y:t.clientY,dx:0,dy:0});}}
function tMove(e){e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joystick.id){let dx=t.clientX-joystick.sx,dy=t.clientY-joystick.sy,d=Math.hypot(dx,dy)||1;if(d>joystick.max){dx=dx/d*joystick.max;dy=dy/d*joystick.max;}Object.assign(joystick,{x:joystick.sx+dx,y:joystick.sy+dy,dx:dx/joystick.max,dy:dy/joystick.max});}}
function tEnd(e){e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joystick.id)Object.assign(joystick,{active:false,id:null,dx:0,dy:0});}
canvas.addEventListener('touchstart',tStart,{passive:false});canvas.addEventListener('touchmove',tMove,{passive:false});canvas.addEventListener('touchend',tEnd,{passive:false});canvas.addEventListener('touchcancel',tEnd,{passive:false});
function releaseSelectionInputGuard(){if(selectionNeedsFreshPointer){selectionNeedsFreshPointer=false;selectionInputGuardUntil=performance.now()+170;}}
addEventListener('pointerup',releaseSelectionInputGuard,true);addEventListener('touchend',releaseSelectionInputGuard,true);addEventListener('touchcancel',releaseSelectionInputGuard,true);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Enter'&&selectionMode&&!e.repeat){if(!ui.confirmSelectionBtn.disabled&&selectionCanInteract())selectionConfirmAction?.();return;}if((e.key==='e'||e.key==='Enter')&&!e.repeat)useActionButton();});addEventListener('keyup',e=>keys[e.key]=false);
addEventListener('error',event=>{recordPlaytestIncident('javascript-error','fatal',`${event.message||event.error||'알 수 없는 오류'} @ ${event.filename||'unknown'}:${event.lineno||0}`,true);});
addEventListener('unhandledrejection',event=>{const reason=event.reason?.stack||event.reason?.message||event.reason||'알 수 없는 Promise 오류';recordPlaytestIncident('unhandled-promise','fatal',reason,true);});
ui.confirmSelectionBtn.onclick=()=>{if(ui.confirmSelectionBtn.disabled||!selectionCanInteract())return;selectionConfirmAction?.();};
ui.selectionCancelBtn.onclick=()=>{if(!selectionCanInteract())return;if(selectionMode==='organ'&&organCinematicPreview){returnToOrganSelection();return;}selectionCancelAction?.();};
ui.audioToggleBtn.onclick=()=>{soundEnabled=!soundEnabled;if(soundEnabled){initAudio();tone(520,.08,'sine',.02,760);}else stopCinematicAudio();renderPauseSummary();};ui.actionButton.onclick=useActionButton;ui.pause.onclick=showPause;ui.resumeBtn.onclick=()=>{paused=false;hideOverlay();syncActionButton();};ui.restartBtn.onclick=()=>{reset();last=performance.now();loopClock=0;};ui.startBtn.onclick=startGame;
})();
