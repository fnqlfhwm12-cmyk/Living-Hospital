name: Finalize v0.4.0.a prototype

on:
  push:
    branches:
      - agent/v035-structural-prototype
    paths:
      - .github/workflows/finalize-v040a.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v035-structural-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generator includes organ room
        run: |
          grep -q "organLab" scripts/build_v040a.mjs
          grep -q "structureOrganChoices" scripts/build_v040a.mjs
      - name: Generate prototype
        run: node scripts/build_v040a.mjs
      - name: Validate repository
        run: node scripts/validate_repo.mjs
      - name: Commit final generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-v040a.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v0.4.0.a: finalize structural prototype with organ room"
          git push origin HEAD:agent/v035-structural-prototype
