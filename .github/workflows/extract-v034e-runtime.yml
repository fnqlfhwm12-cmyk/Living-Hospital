name: Extract v0.3.4.e Runtime

on:
  push:
    branches:
      - fix/v034f-suture-map-spawn
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/extract_v034e_runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-v034e
          path: tmp-runtime/runtime-v034e.js
          if-no-files-found: error
