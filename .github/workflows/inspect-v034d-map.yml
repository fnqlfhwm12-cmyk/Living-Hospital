name: Inspect v0.3.4.d map

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/inspect_v034d_map.mjs'
      - '.github/workflows/inspect-v034d-map.yml'
      - 'v034d/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect_v034d_map.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v034d-map-inspect
          path: tmp/v034d-map-inspect
          retention-days: 1
