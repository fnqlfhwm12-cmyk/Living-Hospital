name: Build v0.3.4.g camera boundary
on:
  push:
    paths:
      - .github/workflows/build-v034g.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.3.4.g
        run: node scripts/build_v034g.mjs
      - name: Validate repository
        run: node scripts/validate_repo.mjs
      - name: Commit generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v034g Living_Hospital_v0.3.4.g.html index.html playtest.html README.md AGENTS.md docs/PROJECT_STATUS.md docs/CHANGELOG.md UPDATE_v0.3.4.g.md
          git diff --cached --quiet || git commit -m "build: publish v0.3.4.g camera boundary"
          git push
