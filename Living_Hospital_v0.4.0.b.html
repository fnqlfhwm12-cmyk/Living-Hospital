<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Living Hospital v0.4.0.b · OMEGA FLOOR</title>
<link rel="stylesheet" href="v034/style.css?v=034" />

<style>
.hpBar{position:relative}.hpBar .fill{position:absolute;left:0;top:0}.hpBar .debt{background:#6f3940;opacity:.95;z-index:0}.hpBar .hpActual{background:#d65454;z-index:1}
#specimenHud{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(143px,calc(env(safe-area-inset-top) + 136px));min-width:70px;height:24px;padding:0 8px;display:flex;align-items:center;justify-content:flex-end;gap:6px;box-sizing:border-box;border:1px solid #ffffff66;border-radius:7px;background:#130f0fdc;font-size:12px;font-weight:850;letter-spacing:.3px;transform-origin:right center;transition:transform .12s,border-color .12s}
#specimenHud.pulse{transform:scale(1.08);border-color:#e6bec8}.specimenVial{position:relative;width:9px;height:13px;border:1px solid #d8d1cb;border-radius:1px 1px 3px 3px;box-sizing:border-box}.specimenVial:before{content:"";position:absolute;left:1px;right:1px;top:4px;bottom:1px;background:#8f344b}.specimenVial:after{content:"";position:absolute;left:2px;top:-4px;width:3px;height:3px;border:1px solid #d8d1cb;background:#eee}
#debug{top:max(173px,calc(env(safe-area-inset-top) + 166px))}
#startScreen{background:radial-gradient(circle at 65% 45%,#352223 0,#171111 42%,#090707 100%)}#startCard.titleLayout{width:min(980px,96vw);height:min(540px,90vh);padding:7vh 7vw max(5vh,env(safe-area-inset-bottom));box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}.titleWordmark h1{margin:0;font-size:clamp(38px,8vw,82px);font-weight:850;letter-spacing:-2px;text-shadow:0 5px 24px #000}.titleMenu{width:min(300px,55vw);margin:0}.titleMenu .btn{background:#151111c9;backdrop-filter:blur(4px)}
.abilityTrack{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin:11px 0 7px}.abilityPip{height:22px;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff2f;border-radius:5px;background:#0d0b0b;color:#ffffff62;font-size:9px}.abilityPip.active{border-color:#e5d7d0;background:#5c3339;color:#fff}.abilityPip.milestone{border-bottom-width:3px}.abilityCurrent{display:grid;gap:3px;border:1px solid #ffffff22;background:#0e0b0b;border-radius:9px;padding:9px;margin-top:8px}.abilityCurrent b{font-size:11px}.abilityCurrent span{font-size:10px;line-height:1.35;opacity:.72}.abilityRow>div{display:grid;gap:4px}.abilityRow small{display:block;font-size:10px;line-height:1.35;opacity:.66;max-width:390px}.specimenMiniIcon{font-size:10px;color:#d7a7b4}
.chapterPanel{max-width:920px}.chapterGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.chapterCard{min-height:190px;padding:15px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid #ffffff49;border-radius:12px;background:#120e0e;color:#fff}.chapterCard small{opacity:.6;letter-spacing:1px}.chapterCard strong{font-size:42px;line-height:1.1;margin:13px 0 5px}.chapterCard span{font-size:12px}.chapterCard p{font-size:11px;line-height:1.4;opacity:.62;margin-top:auto}.chapterCard.selected{border:2px solid #fff;background:#332224}.chapterCard.locked{opacity:.30;filter:grayscale(1)}#chapterEnterBtn:disabled{opacity:.28}
@media(max-height:430px){#startCard.titleLayout{height:94vh;padding:5vh 5vw}.titleWordmark h1{font-size:44px}.titleMenu{width:240px}.chapterCard{min-height:120px;padding:10px}.chapterCard strong{font-size:28px;margin:6px 0 3px}.abilityTrack{margin:7px 0 4px}.abilityPip{height:17px}.abilityCurrent{padding:6px;margin-top:5px}#specimenHud{height:21px;top:max(141px,calc(env(safe-area-inset-top) + 134px))}#debug{top:max(166px,calc(env(safe-area-inset-top) + 159px))}}
@media(max-width:760px){.chapterGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.chapterCard strong{font-size:31px}}

#barStack{min-width:180px}
#structureHud{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(67px,calc(env(safe-area-inset-top) + 60px));display:flex;align-items:center;gap:5px;height:28px;padding:4px 7px;box-sizing:border-box;border:1px solid #ffffff35;border-radius:8px;background:#100d0ddd;font-size:10px;font-weight:800;pointer-events:none}
.structureCell{height:18px;min-width:23px;padding:0 5px;display:flex;align-items:center;justify-content:center;gap:3px;border:1px solid #ffffff20;border-radius:4px;background:#241d1e}.structureCell.weapon{font-size:14px;min-width:26px}.structureCell.primary{border-color:#ffffffa0}.structureCell.secondary{opacity:.72}.structureArrow{opacity:.55;font-size:11px}
#actionButton{display:flex!important;align-items:center!important;justify-content:center!important;font-size:25px!important;font-weight:800!important;color:#fff!important}#actionButton.ready{border-color:var(--action-accent)!important;box-shadow:0 0 0 2px #0008,0 0 16px color-mix(in srgb,var(--action-accent) 55%,transparent)!important}
@media(max-height:430px){#structureHud{top:max(58px,calc(env(safe-area-inset-top) + 52px));height:24px;padding:3px 5px;gap:3px}.structureCell{height:16px;padding:0 4px;font-size:9px}#specimenHud{top:max(112px,calc(env(safe-area-inset-top) + 106px))}#debug{top:max(139px,calc(env(safe-area-inset-top) + 133px))}}


#topLeft{position:absolute!important;left:max(10px,env(safe-area-inset-left))!important;top:max(8px,env(safe-area-inset-top))!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:5px!important;width:auto!important;pointer-events:none}
#healthRow{display:flex;align-items:center;gap:7px;height:30px}
#heartHud{display:flex;align-items:center;gap:2px;height:28px}
.heartUnit{position:relative;display:inline-block;width:25px;height:27px;font:900 27px/27px -apple-system,BlinkMacSystemFont,sans-serif;filter:drop-shadow(0 2px 3px #000a)}
.heartBase,.heartFill{position:absolute;left:0;top:0;display:block;overflow:hidden;white-space:nowrap}.heartBase{width:100%;color:#4c3437;-webkit-text-stroke:1px #d8c9c5}.heartFill{color:#d84f59;-webkit-text-stroke:1px #f0d7d4}
#specialHud{display:flex;align-items:center;gap:4px;min-height:28px}
#organHud{width:auto!important;height:28px!important;display:flex!important;align-items:center!important}.organSlot{width:28px!important;height:28px!important;border-radius:7px!important;font-size:17px!important}.organSlot.empty{display:none!important}
#relicHud{display:flex;align-items:center;gap:3px}.relicHudItem{width:25px;height:25px;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff70;border-radius:6px;background:#171313e8;font-size:15px;box-shadow:0 2px 5px #0008}
#weaponHud{display:flex;align-items:center;gap:4px;height:28px}.weaponHudSlot{width:31px;height:27px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1px solid #ffffff68;border-radius:7px;background:#171313e8;font-size:18px;box-shadow:0 2px 5px #0008}.weaponHudSlot.primary{border:2px solid #eee}.weaponHudSlot.secondary{opacity:.72}.weaponHudSwap{font-size:12px;opacity:.56}
#specimenHud{position:static!important;right:auto!important;top:auto!important;min-width:0!important;width:auto!important;height:21px!important;padding:0 6px!important;justify-content:flex-start!important;gap:5px!important;background:#130f0fc9!important;font-size:11px!important;border-radius:6px!important;transform-origin:left center!important}
#topCenter,#debug,#structureHud{display:none!important}
@media(max-height:430px){#topLeft{top:max(6px,env(safe-area-inset-top))!important;gap:3px!important}#healthRow{height:26px}.heartUnit{width:22px;height:24px;font-size:24px;line-height:24px}#organHud{height:25px!important}.organSlot{width:25px!important;height:25px!important;font-size:15px!important}.relicHudItem{width:23px;height:23px;font-size:13px}.weaponHudSlot{width:28px;height:24px;font-size:16px}#weaponHud{height:24px}#specimenHud{height:19px!important;font-size:10px!important}}

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="topLeft">
    <div id="healthRow">
      <div id="heartHud" aria-label="체력 하트 3개"></div>
      <div id="specialHud" aria-label="장기와 유물"><div id="organHud" aria-label="메인 장기"></div><div id="relicHud" aria-label="획득 유물"></div></div>
    </div>
    <div id="weaponHud" aria-label="획득 무기"><span class="weaponHudSlot primary"><span id="primaryWeaponValue">·</span></span><span class="weaponHudSwap">⇄</span><span class="weaponHudSlot secondary"><span id="secondaryWeaponValue">—</span></span></div>
  <div id="debug"></div>
  <div id="toast"></div>
  <button id="actionButton" aria-label="사용 가능한 상호작용 없음" disabled></button>
</div>

<div id="overlay">
  <div id="panel">
    <h2 id="overlayTitle">성장 선택</h2>
    <div id="cards"></div>
    <div id="selectionFooter">
      <button class="btn" id="selectionCancelBtn">보류</button>
      <button class="btn" id="confirmSelectionBtn" disabled>확인</button>
    </div>
    <div id="pauseMenu">
      <div id="pauseSummary"></div>
      <div class="pauseActions">
        <button class="btn settingBtn" id="audioToggleBtn">음향 켜짐</button>
        <button class="btn" id="resumeBtn">계속하기</button>
        <button class="btn" id="restartBtn">재시작</button>
        <button class="btn" id="mainMenuBtn">저장하고 메인으로</button>
      </div>
    </div>
  </div>
</div>

<div id="rotateScreen">
  <div id="rotateCard" style="text-align:center;">
    <h2>기기를 가로로 돌려주세요</h2>
    <p class="muted">세로 화면에서는 플레이가 자동으로 멈춥니다.</p>
  </div>
</div>

<div id="startScreen" class="metaScreen active">
  <div id="startCard" class="titleLayout">
    <div class="titleWordmark"><h1>Living Hospital</h1></div>
    <div class="menuStack titleMenu">
      <button class="btn menuBtn" id="startBtn">시작</button>
      <button class="btn menuBtn" id="titleSettingsBtn">설정</button>
    </div>
  </div>
</div>
<div id="characterScreen" class="metaScreen"><div class="metaPanel"><h2>수용 개체 선택</h2><div id="characterGrid" class="metaGrid"></div><div class="metaFooter"><button class="btn" id="characterBackBtn">뒤로</button><button class="btn" id="characterConfirmBtn">선택하기</button></div></div></div>
<div id="lobbyScreen" class="metaScreen"><div class="metaPanel"><div class="lobbyLayout"><section class="lobbyBox" id="lobbyCharacter"></section><section class="lobbyBox" id="lobbyAbility"></section></div><div class="metaFooter"><button class="btn" id="changeCharacterBtn">개체 변경</button><button class="btn" id="lobbyRecordBtn">기록</button><button class="btn" id="enterWardBtn">챕터 선택</button></div></div></div>
<div id="chapterScreen" class="metaScreen"><div class="metaPanel chapterPanel"><h2>챕터 선택</h2><div id="chapterGrid" class="chapterGrid"></div><div class="metaFooter"><button class="btn" id="chapterBackBtn">준비 화면</button><button class="btn" id="chapterEnterBtn">진입</button></div></div></div>
<div id="recordScreen" class="metaScreen"><div class="metaPanel"><h2>회수 기록</h2><div id="recordContent"></div><div class="metaFooter"><button class="btn" id="recordBackBtn">돌아가기</button></div></div></div>
<div id="settingsScreen" class="metaScreen"><div class="metaPanel" style="max-width:560px"><h2>설정</h2><div class="abilityRow"><div><b>음향</b><p class="muted">효과음과 병동 BGM</p></div><button class="btn" id="metaAudioBtn">켜짐</button></div><div class="metaFooter"><button class="btn" id="settingsBackBtn">돌아가기</button></div></div></div>
<div id="dialogueBox" class="dialogueBox"><div id="dialogueName" class="dialogueName"></div><div id="dialogueText" class="dialogueText"></div><div class="dialogueHint">화면을 눌러 계속</div></div>
<div class="cinematicShade"></div>

<div id="bootLoading" style="position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:#100d0d;color:#fff;font:700 14px -apple-system,sans-serif">병동을 복구하는 중입니다.</div>
<div id="bootFailure" style="position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:#100d0d;color:#fff;text-align:center;padding:24px;box-sizing:border-box"><div><h2>복구가 중단되었습니다.</h2><p></p><button onclick="location.reload()" style="border:1px solid #fff;background:#251d1d;color:#fff;border-radius:10px;padding:10px 16px">다시 시도</button></div></div>
<script>
(() => {
 const parts=["v040b/game.gz.part01.txt","v040b/game.gz.part02.txt"];
 const fail=(message)=>{const el=document.getElementById('bootFailure');if(el){el.style.display='flex';el.querySelector('p').textContent=message;}};
 Promise.all(parts.map(async path=>{const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error(`${path} · HTTP ${response.status}`);return response.text();}))
  .then(async chunks=>{
   if(!('DecompressionStream' in window))throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다.');
   const binary=atob(chunks.join('').replace(/\s+/g,''));
   const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const source=await new Response(stream).text();
   const blob=new Blob([source],{type:'text/javascript'}),script=document.createElement('script'),url=URL.createObjectURL(blob);
   script.src=url;
   script.onload=()=>{URL.revokeObjectURL(url);document.getElementById('bootLoading')?.remove();};
   script.onerror=()=>fail('게임 스크립트를 시작하지 못했습니다.');
   document.body.appendChild(script);
  })
  .catch(error=>fail(`업데이트 파일을 불러오지 못했습니다. ${error.message}`));
})();
</script>
</body>
</html>
