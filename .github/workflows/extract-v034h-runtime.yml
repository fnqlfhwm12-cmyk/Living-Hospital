name: Extract v0.3.4.h runtime

on:
  push:
    branches:
      - agent/v035-structural-prototype
    paths:
      - scripts/extract_v034h_runtime.mjs
      - .github/workflows/extract-v034h-runtime.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v035-structural-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/extract_v034h_runtime.mjs
      - name: Commit diagnostic runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/runtime-v034h.js debug/runtime-v034h-contexts.txt debug/runtime-v034h-symbols.txt debug/runtime-v034h-targets.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: extract v0.3.4.h runtime for structural refactor"
          git push origin HEAD:agent/v035-structural-prototype
