name: Build v0.4.0.a structural prototype

on:
  push:
    branches:
      - agent/v035-structural-prototype
    paths:
      - scripts/build_v040a.mjs
      - .github/workflows/build-v040a.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v035-structural-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate prototype
        run: node scripts/build_v040a.mjs
      - name: Validate repository
        run: node scripts/validate_repo.mjs
      - name: Commit generated prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v0.4.0.a: room structure and weapon swap prototype"
          git push origin HEAD:agent/v035-structural-prototype
