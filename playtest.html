<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Living Hospital Playtest Monitor</title>
<style>
:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090707}#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#100d0d}#toggle{position:fixed;z-index:2147483646;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:30px;height:30px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(15,12,12,.58);color:#fff;font:800 10px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;opacity:.24;box-shadow:0 2px 8px rgba(0,0,0,.45);-webkit-tap-highlight-color:transparent}#toggle.alert{opacity:.9;border-color:#e57b84;background:#4b171d}#toggle:active{transform:scale(.94)}#shade{position:fixed;z-index:2147483645;inset:0;display:none;background:rgba(0,0,0,.60)}#shade.open{display:block}#panel{position:fixed;z-index:2147483647;left:50%;top:50%;transform:translate(-50%,-50%);display:none;width:min(650px,94vw);max-height:89vh;overflow:auto;box-sizing:border-box;padding:14px;border:1px solid rgba(255,255,255,.75);border-radius:14px;background:rgba(24,18,18,.985);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;box-shadow:0 18px 55px rgba(0,0,0,.72)}#panel.open{display:block}h1{margin:0 0 4px;font-size:18px}#autoReason{margin:0 0 10px;font-size:11px;opacity:.72}#summary{white-space:pre-wrap;margin:0 0 12px;padding:10px;border-radius:9px;background:#100d0d;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.actions a{box-sizing:border-box;border:1px solid rgba(255,255,255,.62);border-radius:9px;background:#2a2020;color:#fff;padding:11px 10px;text-align:center;text-decoration:none;font:700 13px/1.1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.wide{grid-column:1/-1}#status{min-height:18px;margin-top:9px;font-size:12px;opacity:.82}
</style>
</head>
<body>
<iframe id="gameFrame" title="Living Hospital" src="./Living_Hospital_v0.3.4.e.html" allow="autoplay"></iframe>
<div id="shade"></div>
<button id="toggle" type="button" aria-label="비상 기록 열기">R</button>
<section id="panel" aria-label="플레이테스트 기록">
<h1>플레이테스트 기록</h1>
<p id="autoReason">비상용 수동 기록</p>
<pre id="summary">게임을 불러오는 중…</pre>
<div class="actions">
<button id="copyBtn" type="button">보고서 복사</button><button id="shareBtn" type="button">공유</button>
<button id="resetBtn" type="button">기록 초기화</button><button id="closeBtn" type="button">닫기</button>
<a class="wide" href="./Living_Hospital_v0.3.4.e.html">일반 플레이 열기</a>
</div><div id="status" role="status"></div>
</section>
<script>
(()=>{'use strict';
const PROTOCOL='LH_PLAYTEST_V1',GAME_FILE='Living_Hospital_v0.3.4.e.html',frame=document.getElementById('gameFrame'),toggle=document.getElementById('toggle'),panel=document.getElementById('panel'),shade=document.getElementById('shade'),summary=document.getElementById('summary'),status=document.getElementById('status'),autoReason=document.getElementById('autoReason');
const state={resetAt:new Date(),fps:[],latest:null,min:null,avg:null,longTasks:0,longMs:0,touches:0,visibility:0,orientation:0,errors:[],rejections:[],incidents:[],gameSnapshot:null,autoTrigger:'manual'};let frames=0,windowStart=performance.now(),observer=null;
const clamp=(v,n=1200)=>String(v??'').slice(0,n);const orientation=()=>screen.orientation?.type||(innerWidth>=innerHeight?'landscape':'portrait');
function setAutoReason(reason){state.autoTrigger=reason||'manual';autoReason.textContent=reason==='run-ended'?'플레이 종료로 자동 생성됨':reason==='fatal-error'?'치명적 오류로 자동 생성됨':reason==='critical-performance'?'심각한 성능 이상으로 자동 생성됨':'비상용 수동 기록'}
function record(kind,msg,src='',line=0,severity='error'){const arr=kind==='rejection'?state.rejections:state.errors;arr.push({at:new Date().toISOString(),message:clamp(msg),source:clamp(src,250),line,severity});if(arr.length>30)arr.shift()}
function fps(now){frames++;const elapsed=now-windowStart;if(elapsed>=1000){const value=Math.round(frames*10000/elapsed)/10;state.latest=value;state.fps.push(value);if(state.fps.length>900)state.fps.shift();state.min=Math.min(...state.fps);state.avg=Math.round(state.fps.reduce((a,b)=>a+b,0)/state.fps.length*10)/10;frames=0;windowStart=now;if(panel.classList.contains('open'))render()}requestAnimationFrame(fps)}requestAnimationFrame(fps);
function childText(selector){try{return clamp(frame.contentDocument?.querySelector(selector)?.textContent?.trim()||'',1500)}catch{return''}}
function snap(){const sec=Math.max(0,Math.round((Date.now()-state.resetAt)/1000));let title='';try{title=frame.contentDocument?.title||''}catch{}return{generatedAt:new Date().toISOString(),gameFile:GAME_FILE,gameTitle:title,gameTimer:state.gameSnapshot?.gameTimeText||childText('#timer'),gameDebug:childText('#debug'),sessionSeconds:sec,autoTrigger:state.autoTrigger,gameTelemetry:state.gameSnapshot,performance:{averageFps:state.avg,minimumFps:state.min,latestFps:state.latest,longTasks:state.longTasks,longTaskTotalMs:Math.round(state.longMs)},interaction:{touches:state.touches,visibilityChanges:state.visibility,orientationChanges:state.orientation},environment:{viewport:`${innerWidth}x${innerHeight}`,devicePixelRatio,orientation:orientation(),userAgent:navigator.userAgent},incidents:state.incidents,errors:state.errors,unhandledRejections:state.rejections}}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function allIncidents(d){const unique=new Map();for(const x of [...(d.gameTelemetry?.incidents||[]),...(d.incidents||[])])unique.set(`${x.code||'incident'}|${x.at||''}|${x.detail||''}`,x);return [...unique.values()]}
function incidentLines(d){const all=allIncidents(d);return all.length?all.map((x,i)=>`${i+1}. [${x.severity||'warning'}] ${x.code||'incident'} · ${x.detail||''} · ${x.gameTimeText||''}`).join('\n'):'없음'}
function report(d=snap()){const e=d.errors.length?d.errors.map((x,i)=>`${i+1}. ${x.message} (${x.source||'unknown'}:${x.line||0})`).join('\n'):'없음',r=d.unhandledRejections.length?d.unhandledRejections.map((x,i)=>`${i+1}. ${x.message}`).join('\n'):'없음',g=d.gameTelemetry||{},p=g.performance||{},c=g.counts||{},pl=g.player||{};return`# Living Hospital 플레이테스트 보고서\n\n- 생성 시각: ${d.generatedAt}\n- 자동 생성 원인: ${d.autoTrigger}\n- 게임 파일: ${d.gameFile}\n- 게임 제목: ${d.gameTitle||'확인 불가'}\n- 기록 시간: ${fmt(d.sessionSeconds)}\n- 게임 타이머: ${d.gameTimer||'확인 불가'}\n- 종료 원인: ${g.reason||'진행 중 수동 기록'}\n- 완료 여부: ${g.completed===true?'완료':g.completed===false?'미완료':'진행 중'}\n- 처치 수: ${g.kills??'확인 불가'}\n\n## 게임 내부 성능\n\n- 현재 FPS: ${p.currentFps??'확인 불가'}\n- 최저 FPS: ${p.minimumFps??d.performance.minimumFps??'표본 부족'}\n- 평균 프레임: ${p.averageFrameMs??'확인 불가'}ms\n- 최대 프레임 지연: ${p.maximumFrameMs??'확인 불가'}ms\n- 33ms 초과: ${p.slowFrames??'확인 불가'}회\n- 품질 단계: Q${p.qualityLevel??'?'}\n- 현재/최대 적: ${c.enemies??'?'} / ${c.maxEnemies??'?'}\n- 현재/최대 구슬: ${c.orbs??'?'} / ${c.maxOrbs??'?'}\n- 투사체: ${c.projectiles??'?'} · 파티클: ${c.particles??'?'} · 혈흔: ${c.clotFields??'?'}\n\n## 플레이어 상태\n\n- HP: ${pl.hp??'?'} / ${pl.maxHp??'?'}\n- 위치: ${pl.x??'?'}, ${pl.y??'?'}\n- 메인 장기: ${g.loadout?.activeOrgan||'없음'}\n- 무기: ${g.loadout?.weapons?Object.entries(g.loadout.weapons).map(([k,v])=>`${k} Lv.${v}`).join(' · '):'확인 불가'}\n\n## 자동 감지 이상\n\n${incidentLines(d)}\n\n## 외부 계측\n\n- 평균 FPS: ${d.performance.averageFps??'표본 부족'}\n- 최저 FPS: ${d.performance.minimumFps??'표본 부족'}\n- 최근 FPS: ${d.performance.latestFps??'표본 부족'}\n- Long Task: ${d.performance.longTasks}회 / ${d.performance.longTaskTotalMs}ms\n- 터치 입력: ${d.interaction.touches}회\n- 화면 방향 변경: ${d.interaction.orientationChanges}회\n- 화면 숨김·복귀: ${d.interaction.visibilityChanges}회\n- 환경: ${d.environment.viewport}, DPR ${d.environment.devicePixelRatio}, ${d.environment.orientation}\n- 사용자 환경: ${d.environment.userAgent}\n\n## 게임 디버그 표시\n\n${d.gameDebug||'없음'}\n\n## JavaScript 오류\n\n${e}\n\n## 처리되지 않은 Promise 오류\n\n${r}\n\n## 체감 메모\n\n- 난이도:\n- 조작감:\n- 공격 판독성:\n- 발열·프레임 체감:\n- 재현 시점:\n- 수정 필요 사항:\n`}
function render(){const d=snap(),g=d.gameTelemetry||{},p=g.performance||{},c=g.counts||{};summary.textContent=[`빌드  ${d.gameFile}`,`원인  ${g.reason||d.autoTrigger}`,`시간  ${d.gameTimer||fmt(d.sessionSeconds)} · 처치 ${g.kills??'—'}`,`FPS   게임 ${p.currentFps??'—'} · 최저 ${p.minimumFps??d.performance.minimumFps??'—'} · 외부 평균 ${d.performance.averageFps??'—'}`,`지연  최대 ${p.maximumFrameMs??'—'}ms · 33ms+ ${p.slowFrames??'—'}회`,`개체  적 ${c.enemies??'—'} · 구슬 ${c.orbs??'—'} · 파티클 ${c.particles??'—'}`,`이상  ${allIncidents(d).length}건 · JS ${d.errors.length}건 · Promise ${d.unhandledRejections.length}건`].join('\n')}
function open(v){panel.classList.toggle('open',v);shade.classList.toggle('open',v);if(v)render()}
function autoOpen(reason,delay=250){setAutoReason(reason);toggle.classList.add('alert');setTimeout(()=>open(true),delay)}
async function copy(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw Error('복사 기능을 사용할 수 없습니다.')}
function attach(){try{const w=frame.contentWindow,d=frame.contentDocument;w.addEventListener('error',e=>{record('error',e.message||e.error,e.filename,e.lineno,'fatal');autoOpen('fatal-error',60)});w.addEventListener('unhandledrejection',e=>{record('rejection',e.reason?.stack||e.reason?.message||e.reason,'',0,'fatal');autoOpen('fatal-error',60)});d.addEventListener('touchstart',e=>{state.touches+=Math.max(1,e.touches?.length||1)},{passive:true,capture:true});if(w.PerformanceObserver){observer?.disconnect?.();observer=new w.PerformanceObserver(list=>{for(const x of list.getEntries()){state.longTasks++;state.longMs+=x.duration||0}});observer.observe({type:'longtask',buffered:true})}}catch(e){record('error',`모니터 연결 실패: ${e.message||e}`)}render()}
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;const msg=event.data;if(!msg||msg.protocol!==PROTOCOL)return;if(msg.type==='LH_RUN_STARTED'){state.resetAt=new Date();state.gameSnapshot=null;state.incidents=[];state.errors=[];state.rejections=[];toggle.classList.remove('alert');setAutoReason('manual');return}if(msg.type==='LH_INCIDENT'){const incident=msg.payload?.incident||msg.payload;state.incidents.push(incident);if(state.incidents.length>40)state.incidents.shift();if(msg.payload?.snapshot)state.gameSnapshot=msg.payload.snapshot;const severity=incident?.severity;if(severity==='fatal')autoOpen('fatal-error',80);else if(severity==='critical')autoOpen('critical-performance',120);else toggle.classList.add('alert');return}if(msg.type==='LH_RUN_ENDED'){state.gameSnapshot=msg.payload||null;autoOpen('run-ended',420)}});
frame.addEventListener('load',attach);window.addEventListener('error',e=>record('error',e.message||e.error,e.filename,e.lineno));window.addEventListener('unhandledrejection',e=>record('rejection',e.reason?.stack||e.reason?.message||e.reason));document.addEventListener('visibilitychange',()=>state.visibility++);window.addEventListener('orientationchange',()=>state.orientation++);
toggle.addEventListener('click',()=>{setAutoReason('manual');open(true)});shade.addEventListener('click',()=>open(false));document.getElementById('closeBtn').addEventListener('click',()=>open(false));document.getElementById('copyBtn').addEventListener('click',async()=>{try{await copy(report());status.textContent='보고서를 복사했습니다.'}catch(e){status.textContent=`복사 실패: ${e.message||e}`}});document.getElementById('shareBtn').addEventListener('click',async()=>{try{const text=report();if(navigator.share)await navigator.share({title:'Living Hospital 플레이테스트 보고서',text});else await copy(text)}catch(e){if(e?.name!=='AbortError')status.textContent=`공유 실패: ${e.message||e}`}});document.getElementById('resetBtn').addEventListener('click',()=>{state.resetAt=new Date();state.fps=[];state.latest=state.min=state.avg=null;state.longTasks=state.longMs=state.touches=state.visibility=state.orientation=0;state.errors=[];state.rejections=[];state.incidents=[];state.gameSnapshot=null;toggle.classList.remove('alert');setAutoReason('manual');status.textContent='계측 기록을 초기화했습니다. 게임은 계속 진행됩니다.';render()});render();setInterval(()=>{if(panel.classList.contains('open'))render()},1000);
})();
</script>
</body>
</html>
